# Continuous integration (report section 29).
#
#   lint -> typecheck -> test -> build
#
# Tests run against real PostgreSQL. The embedded PGlite driver means CI needs
# no database service container, so the suite exercises real DDL, real
# constraints and real full-text ranking without infrastructure.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.22.0'
  # Tests need a valid configuration; the app refuses to boot without one.
  AUTH_SECRET: ci-only-secret-value-at-least-32-characters-long
  DATABASE_DRIVER: pglite
  NODE_ENV: test

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile fails the build if the lockfile is out of date with
      # the manifests, which is what makes CI a real check on dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: a new CVE in a transitive dependency should surface without
    # blocking an unrelated pull request.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=high

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only on main: image builds are slow and rarely break independently of the
    # code that CI already verified.
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        image: [api, worker, web]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          # Reuse layers across runs so an unchanged dependency tree is not
          # reinstalled on every build.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
